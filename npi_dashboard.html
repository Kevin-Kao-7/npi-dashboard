<html lang="zh-TW">

<meta charset="UTF-8">

<title>NPI Check Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#242836;
  --border:#2e3345;--text:#e0e0e0;--text2:#8a8fa8;
  --kickoff:#4472C4;--design:#00B0F0;--dvt:#7030A0;--evt:#ED7D31;
  --mvt:#FF4444;--ats:#70AD47;--study:#FFC000;--mp:#FF69B4;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}

.header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--bg2);border-bottom:1px solid var(--border)}
.header h1{font-size:18px;font-weight:600;color:#fff}
.header .date{font-size:12px;color:var(--text2)}

.stats{display:flex;gap:10px;padding:12px 24px;flex-wrap:wrap}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;min-width:90px;text-align:center;cursor:pointer;transition:.2s}
.stat-card:hover{border-color:#555}
.stat-card .label{font-size:11px;color:var(--text2);margin-bottom:2px}
.stat-card .value{font-size:24px;font-weight:700}
.stat-card.active{border-color:#fff;background:var(--bg3)}
.sc-model .value{color:#fff}
.sc-kickoff .value{color:var(--kickoff)}.sc-design .value{color:var(--design)}
.sc-dvt .value{color:var(--dvt)}.sc-evt .value{color:var(--evt)}
.sc-mvt .value{color:var(--mvt)}.sc-ats .value{color:var(--ats)}
.sc-study .value{color:var(--study)}

.filters{display:flex;gap:8px;padding:0 24px 10px;align-items:center;flex-wrap:wrap}
.filters label{font-size:11px;color:var(--text2)}
.filters input{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:12px;outline:none}
.filters input:focus{border-color:#666}
.search-input{width:180px}

/* Multi-select dropdown */
.ms-wrap{position:relative;display:inline-block;vertical-align:middle}
.ms-btn{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:11px;cursor:pointer;min-width:120px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;user-select:none;transition:.15s}
.ms-btn:hover{border-color:#666}
.ms-btn .ms-arrow{font-size:8px;color:var(--text2);transition:transform .2s}
.ms-btn.open .ms-arrow{transform:rotate(180deg)}
.ms-btn .ms-count{font-size:9px;background:var(--bg3);color:var(--text2);padding:1px 5px;border-radius:8px;margin-left:auto}
.ms-panel{position:absolute;top:100%;left:0;min-width:160px;max-height:220px;overflow-y:auto;background:var(--bg2);border:1px solid var(--border);border-radius:6px;margin-top:4px;z-index:20;display:none;box-shadow:0 6px 18px rgba(0,0,0,.4);padding:4px 0}
.ms-panel.show{display:block}
.ms-opt{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:11px;color:var(--text);cursor:pointer;transition:.1s}
.ms-opt:hover{background:var(--bg3)}
.ms-opt.all-opt{border-bottom:1px solid var(--border);margin-bottom:2px;font-weight:600}
.ms-check{width:14px;height:14px;border:1.5px solid var(--text2);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;flex-shrink:0;transition:.1s}
.ms-opt.checked .ms-check{background:#555;border-color:#555;color:#fff}

.sort-btn{background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:5px;padding:5px 10px;font-size:11px;cursor:pointer;white-space:nowrap}
.sort-btn.active{border-color:#fff;color:#fff;background:#333}
.reset-btn{background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:5px;padding:5px 10px;font-size:11px;cursor:pointer}

.gantt-section{padding:0 24px 16px}
.gantt-container{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.gantt-header{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border)}
.gantt-header h2{font-size:13px;font-weight:600}
.gantt-legend{display:flex;gap:14px;padding:6px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.gantt-legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text2)}
.gantt-legend-dot{width:12px;height:8px;border-radius:2px;flex-shrink:0}
.gantt-scroll{overflow-x:auto}

.gantt-table{width:100%;border-collapse:collapse;min-width:1200px}
.gantt-table thead th{position:sticky;top:0;z-index:5;background:var(--bg3);font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
.gantt-table thead th.sortable{cursor:pointer}
.gantt-table thead th.sortable:hover{color:#fff}
.gantt-table thead th .sort-arrow{margin-left:3px;font-size:9px;opacity:.5}
.gantt-table thead th.sortable.asc .sort-arrow,.gantt-table thead th.sortable.desc .sort-arrow{opacity:1}

/* Sticky fixed columns */
.gantt-table thead th.col-model{position:sticky;left:0;z-index:10;min-width:80px}
.gantt-table thead th.col-toggle{position:sticky;left:80px;z-index:10;min-width:30px;width:30px;text-align:center;padding:0}
.gantt-table thead th.col-stage{position:sticky;left:110px;z-index:10;min-width:65px}
.gantt-table thead th.col-mkt{position:sticky;left:175px;z-index:10;min-width:200px}
.gantt-table thead th.col-mp{position:sticky;left:375px;z-index:10;min-width:85px}

.gantt-table tbody tr{border-bottom:1px solid rgba(255,255,255,.03);transition:.15s}
.gantt-table tbody tr:hover{background:rgba(255,255,255,.03)}
.gantt-table tbody tr.child-row{display:none}
.gantt-table tbody tr.child-row.open{display:table-row}
.gantt-table tbody tr.child-row td{color:var(--text2);font-size:11px}

.gantt-table tbody td{padding:6px 8px;font-size:11px;white-space:nowrap;vertical-align:middle}
.gantt-table tbody td.col-model{position:sticky;left:0;z-index:3;background:var(--bg2);font-weight:600;color:#fff}
.gantt-table tbody tr:hover td.col-model{background:var(--bg3)}
.gantt-table tbody td.col-toggle{position:sticky;left:80px;z-index:3;background:var(--bg2);text-align:center;padding:0;cursor:pointer;font-size:14px;color:var(--text2);user-select:none}
.gantt-table tbody td.col-toggle:hover{color:#fff}
.gantt-table tbody tr:hover td.col-toggle{background:var(--bg3)}
.gantt-table tbody td.col-stage{position:sticky;left:110px;z-index:3;background:var(--bg2)}
.gantt-table tbody tr:hover td.col-stage{background:var(--bg3)}
.gantt-table tbody td.col-mkt{position:sticky;left:175px;z-index:3;background:var(--bg2);max-width:200px;overflow:hidden;text-overflow:ellipsis}
.gantt-table tbody tr:hover td.col-mkt{background:var(--bg3)}
.gantt-table tbody td.col-mp{position:sticky;left:375px;z-index:3;background:var(--bg2);font-variant-numeric:tabular-nums}
.gantt-table tbody tr:hover td.col-mp{background:var(--bg3)}

.badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:600;color:#fff}
.badge-kickoff{background:var(--kickoff)}.badge-design{background:var(--design)}
.badge-dvt{background:var(--dvt)}.badge-evt{background:var(--evt)}
.badge-mvt{background:var(--mvt)}.badge-ats{background:var(--ats)}.badge-study{background:var(--study)}

.gantt-cell-month{text-align:center;font-size:9px;color:var(--text2);padding:6px 2px}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:#FF4444;z-index:4;pointer-events:none}
.today-line::before{content:'Today';position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:700;color:#FF4444;white-space:nowrap}

.gantt-bar{position:absolute;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;cursor:pointer;transition:filter .15s;overflow:hidden;white-space:nowrap}
.gantt-bar:hover{filter:brightness(1.2);z-index:2}
.bar-kickoff{background:var(--kickoff)}.bar-design{background:var(--design)}
.bar-dvt{background:var(--dvt)}.bar-evt{background:var(--evt)}
.bar-mvt{background:var(--mvt)}.bar-ats{background:var(--ats)}.bar-mp{background:var(--mp)}

.tooltip{position:fixed;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:11px;z-index:100;pointer-events:none;display:none;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tooltip .tt-model{font-size:13px;font-weight:700;color:#fff;margin-bottom:4px}
.tooltip .tt-row{display:flex;gap:6px;margin:2px 0}
.tooltip .tt-label{color:var(--text2);min-width:60px}
.tooltip .tt-val{color:var(--text)}

.detail-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:50;display:none}
.detail-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;min-width:460px;max-width:650px;max-height:80vh;overflow-y:auto;z-index:51;display:none}
.detail-panel .dp-close{position:absolute;top:12px;right:16px;font-size:20px;cursor:pointer;color:var(--text2)}
.detail-panel .dp-close:hover{color:#fff}
.detail-panel h2{font-size:16px;color:#fff;margin-bottom:3px}
.detail-panel .dp-mkt{font-size:12px;color:var(--text2);margin-bottom:14px}
.detail-panel .dp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.detail-panel .dp-field{background:var(--bg3);border-radius:6px;padding:8px 12px}
.detail-panel .dp-field-label{font-size:10px;color:var(--text2);margin-bottom:1px}
.detail-panel .dp-field-value{font-size:12px;color:var(--text)}
.detail-panel .dp-section{margin-bottom:12px}
.detail-panel .dp-section h3{font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.detail-panel .dp-text{font-size:12px;color:var(--text);line-height:1.5;white-space:pre-wrap}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#444;border-radius:3px}
</style>
</head>

    },
    {
      "model": "26VL",
      "mkt": "Modern A16 J1M",
      "cpu": "RMB 100 35W",
      "gpu": "",
      "npm": "杜晨光",
      "stage": "DVT",
      "status": "MVT預計4/18 Assy，RD樣機預計ETD @4/26 發出",
      "highlight": "Wlan 備料：4/10 業務確認備料MOQ 6K ，按備料L/T 12W 預計7/10 到料，與原計劃6/15 ATS start，Gap 25天 ，實際待採購確認交期是否有Pull in機會",
      "mp_sort": "2026/06/25",
      "orig_idx": 44,
      "dates": {
        "Kickoff": "2026/01/05",
        "DVT-start": "2026/03/30",
        "MVT-start": "2026/04/17",
        "BTO ready": "2026/05/15",
        "ATS-start": "2026/06/15",
        "MP": "2026/06/25"
      }
    }
  ]
};

const STAGE_ORDER = ['Design','DVT','EVT','MVT','ATS','Study'];
const BAR_CLASSES = {Kickoff:'bar-kickoff',Design:'bar-design',DVT:'bar-dvt',EVT:'bar-evt',MVT:'bar-mvt',ATS:'bar-ats',MP:'bar-mp'};
const DATE_KEYS = ['Kickoff','DVT-start','EVT-start','MVT-start','ATS-start','MP'];
const LEGEND_ITEMS = [
  {key:'Kickoff',color:'var(--kickoff)'},{key:'Design',color:'var(--design)'},
  {key:'DVT',color:'var(--dvt)'},{key:'EVT',color:'var(--evt)'},
  {key:'MVT',color:'var(--mvt)'},{key:'ATS',color:'var(--ats)'},
  {key:'MP',color:'var(--mp)'}
];

const MONTHS = [];
let dd = new Date(2024,10,1);
while(dd <= new Date(2026,9,1)){
  MONTHS.push({y:dd.getFullYear(),m:dd.getMonth()+1});
  dd = new Date(dd.getFullYear(),dd.getMonth()+1,1);
}
const TOTAL_MONTHS = MONTHS.length;
const CELL_W = 36;

let activeStages=new Set(), filterCpuVals=new Set(), filterGpuVals=new Set(), filterSearchVal='';
let sortKey='model'; // 'model' or 'mp'
let expandedModels = new Set();

// Compute stats from all records
const stats = {Model:0,Design:0,DVT:0,EVT:0,MVT:0,ATS:0,Study:0};
const modelSeen = new Set();
DATA.records.forEach(r=>{
  if(!modelSeen.has(r.model)){modelSeen.add(r.model);stats.Model++}
  const s = r.stage;
  if(s==='Design')stats.Design++;
  else if(s==='DVT')stats.DVT++;
  else if(s==='EVT')stats.EVT++;
  else if(s==='MVT')stats.MVT++;
  else if(s==='ATS')stats.ATS++;
  else if(s==='Study')stats.Study++;
});

document.getElementById('headerDate').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

function getGrouped(){
  // Group by model, pick parent = earliest MP (if tie, smallest orig_idx)
  const map = {};
  DATA.records.forEach(r=>{
    if(!map[r.model]) map[r.model] = [];
    map[r.model].push(r);
  });
  // For each group, sort by mp_sort then orig_idx, first = parent
  Object.values(map).forEach(arr=>arr.sort((a,b)=>a.mp_sort.localeCompare(b.mp_sort)||a.orig_idx-b.orig_idx));
  return map;
}

function getFilteredGroups(){
  const allGroups = getGrouped();
  const result = {};
  for(const [model, rows] of Object.entries(allGroups)){
    // Filter: if any row matches, include the group
    const filtered = rows.filter(r=>{
      if(activeStages.size>0 && !activeStages.has(r.stage)) return false;
      if(filterCpuVals.size>0 && !filterCpuVals.has(r.cpu)) return false;
      if(filterGpuVals.size>0 && !filterGpuVals.has(r.gpu)) return false;
      if(filterSearchVal){
        const q=filterSearchVal.toLowerCase();
        if(!r.model.toLowerCase().includes(q) && !r.mkt.toLowerCase().includes(q)) return false;
      }
      return true;
    });
    if(filtered.length>0) result[model]=filtered;
  }
  return result;
}

function getSortedGroups(groups){
  const entries = Object.entries(groups);
  if(sortKey==='mp'){
    entries.sort((a,b)=>{
      const ma=a[1][0].mp_sort, mb=b[1][0].mp_sort;
      return ma.localeCompare(mb);
    });
  } else {
    entries.sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}));
  }
  return entries;
}

function renderStats(){
  const c=document.getElementById('statsContainer');
  let h=`<div class="stat-card sc-model active" data-stage="all" onclick="toggleStage('all')"><div class="label">Model</div><div class="value">${stats.Model}</div></div>`;
  for(const s of STAGE_ORDER) h+=`<div class="stat-card sc-${s.toLowerCase()}" data-stage="${s}" onclick="toggleStage('${s}')"><div class="label">${s}</div><div class="value">${stats[s]}</div></div>`;
  c.innerHTML=h;
}

function renderLegend(){
  const c=document.getElementById('ganttLegend');
  let h='';
  for(const item of LEGEND_ITEMS){
    h+=`<div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:${item.color}"></div>${item.key}</div>`;
  }
  c.innerHTML=h;
}

function toggleStage(s){
  if(s==='all'){activeStages.clear()}
  else{
    if(activeStages.has(s))activeStages.delete(s);
    else activeStages.add(s);
  }
  updateMsComponent('msStage');
  syncStatCards();
  renderGantt();
}

function syncStatCards(){
  document.querySelectorAll('.stat-card').forEach(el=>{
    const s=el.dataset.stage;
    el.classList.toggle('active',s==='all'?activeStages.size===0:activeStages.has(s));
  });
}

/* Multi-select dropdown component */
function createMsDropdown(containerId, items, selectedSet, onChange){
  const wrap=document.getElementById(containerId);
  const allChecked=selectedSet.size===0;
  let btnLabel=allChecked?'All':selectedSet.size+' selected';
  let h=`<div class="ms-btn" onclick="toggleMsPanel('${containerId}')">${btnLabel}<span class="ms-arrow">▼</span></div>`;
  h+=`<div class="ms-panel" id="${containerId}_panel">`;
  h+=`<div class="ms-opt all-opt ${allChecked?'checked':''}" onclick="msToggleAll('${containerId}')"><div class="ms-check">✓</div>All</div>`;
  for(const item of items){
    const ck=selectedSet.has(item)?'checked':'';
    h+=`<div class="ms-opt ${ck}" data-val="${escAttr(item)}" onclick="msToggleItem('${containerId}','${escAttr(item)}')"><div class="ms-check">✓</div>${item}</div>`;
  }
  h+=`</div>`;
  wrap.innerHTML=h;
  wrap._items=items;
  wrap._onChange=onChange;
}

function toggleMsPanel(id){
  const panel=document.getElementById(id+'_panel');
  const btn=document.getElementById(id).querySelector('.ms-btn');
  const isOpen=panel.classList.contains('show');
  // close all
  document.querySelectorAll('.ms-panel.show').forEach(p=>p.classList.remove('show'));
  document.querySelectorAll('.ms-btn.open').forEach(b=>b.classList.remove('open'));
  if(!isOpen){
    panel.classList.add('show');
    btn.classList.add('open');
  }
}

function msToggleAll(id){
  const wrap=document.getElementById(id);
  const set=wrap._onChange();
  set.clear();
  updateMsComponent(id);
  syncStatCards();
  renderGantt();
}

function msToggleItem(id,val){
  const wrap=document.getElementById(id);
  const set=wrap._onChange();
  if(set.has(val))set.delete(val);else set.add(val);
  updateMsComponent(id);
  syncStatCards();
  renderGantt();
}

function updateMsComponent(id){
  const wrap=document.getElementById(id);
  if(!wrap||!wrap._onChange)return;
  const set=wrap._onChange();
  const items=wrap._items;
  const allChecked=set.size===0;
  const btn=wrap.querySelector('.ms-btn');
  btn.innerHTML=(allChecked?'All':set.size+' selected')+`<span class="ms-arrow">▼</span>`;
  const panel=document.getElementById(id+'_panel');
  if(!panel)return;
  const opts=panel.querySelectorAll('.ms-opt');
  opts.forEach(o=>{
    if(o.classList.contains('all-opt')){o.classList.toggle('checked',allChecked)}
    else{o.classList.toggle('checked',set.has(o.dataset.val))}
  });
}

function initFilters(){
  const cpuItems=[...new Set(DATA.records.map(r=>r.cpu).filter(Boolean))].sort();
  const gpuItems=[...new Set(DATA.records.map(r=>r.gpu).filter(Boolean))].sort();
  createMsDropdown('msStage',STAGE_ORDER,activeStages,()=>activeStages);
  createMsDropdown('msCpu',cpuItems,filterCpuVals,()=>filterCpuVals);
  createMsDropdown('msGpu',gpuItems,filterGpuVals,()=>filterGpuVals);
  document.getElementById('filterSearch').oninput=e=>{filterSearchVal=e.target.value;renderGantt()};
  // Close dropdowns when clicking outside
  document.addEventListener('click',e=>{
    if(!e.target.closest('.ms-wrap')){
      document.querySelectorAll('.ms-panel.show').forEach(p=>p.classList.remove('show'));
      document.querySelectorAll('.ms-btn.open').forEach(b=>b.classList.remove('open'));
    }
  });
}

function resetFilters(){
  activeStages.clear();filterCpuVals.clear();filterGpuVals.clear();filterSearchVal='';sortKey='model';
  updateMsComponent('msStage');updateMsComponent('msCpu');updateMsComponent('msGpu');
  document.getElementById('filterSearch').value='';
  document.getElementById('sortModel').classList.add('active');
  document.getElementById('sortMP').classList.remove('active');
  document.querySelectorAll('.stat-card').forEach(el=>el.classList.toggle('active',el.dataset.stage==='all'));
  expandedModels.clear();
  renderGantt();
}

function parseDate(s){if(!s)return null;const p=s.split('/');return new Date(+p[0],+p[1]-1,+p[2])}
function getMonthIndex(dt){const y=dt.getFullYear(),m=dt.getMonth()+1;for(let i=0;i<TOTAL_MONTHS;i++){if(MONTHS[i].y===y&&MONTHS[i].m===m)return i}return -1}

function getStageSegments(r){
  const dates=r.dates,segs=[];
  const chain=[
    {key:'Kickoff',dk:'Kickoff'},
    {key:'DVT',dk:'DVT-start'},
    {key:'EVT',dk:'EVT-start'},
    {key:'MVT',dk:'MVT-start'},
    {key:'ATS',dk:'ATS-start'},
    {key:'MP',dk:'MP'}
  ];
  for(let i=0;i<chain.length;i++){
    const s=dates[chain[i].dk];if(!s)continue;
    const si=getMonthIndex(parseDate(s));if(si<0)continue;
    let ei=null;
    for(let j=i+1;j<chain.length;j++){
      const ns=dates[chain[j].dk];
      if(ns){ei=getMonthIndex(parseDate(ns));break}
    }
    if(ei===null)ei=si+1;
    segs.push({name:chain[i].key,cls:BAR_CLASSES[chain[i].key],start:si,end:ei});
  }
  return segs;
}

function toggleExpand(model){
  if(expandedModels.has(model))expandedModels.delete(model);
  else expandedModels.add(model);
  renderGantt();
}

function escAttr(s){return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;')}

function renderBarsHtml(r){
  const segs=getStageSegments(r);
  const BAR_H=20;
  let h='';
  for(let i=0;i<TOTAL_MONTHS;i++){
    const left=i*CELL_W;
    const bg=MONTHS[i].y===2024?'rgba(68,114,196,.06)':MONTHS[i].y===2025?'rgba(112,173,71,.06)':'rgba(237,125,49,.06)';
    h+=`<div style="position:absolute;left:${left}px;top:0;width:${CELL_W}px;height:100%;border-right:1px solid rgba(255,255,255,.03);background:${bg}"></div>`;
  }
  // Build month->segments map for horizontal splitting
  const monthSegs={};
  for(const seg of segs){
    const end=Math.max(seg.end, seg.start+1); // ensure at least 1 month
    for(let m=seg.start;m<end;m++){
      if(!monthSegs[m])monthSegs[m]=[];
      monthSegs[m].push(seg);
    }
  }
  // Draw segments with horizontal splitting within same month
  for(const seg of segs){
    const end=Math.max(seg.end, seg.start+1); // ensure at least 1 month
    // For each month this segment spans, calculate horizontal position
    for(let m=seg.start;m<end;m++){
      const ms=monthSegs[m]||[];
      const idx=ms.indexOf(seg);
      const count=ms.length;
      const segW=CELL_W/count;
      const left=m*CELL_W+idx*segW+1;
      const segWidth=segW-2;
      const label=segWidth>12?seg.name.substring(0,1):'';
      h+=`<div class="gantt-bar ${seg.cls}" style="left:${left}px;top:4px;width:${segWidth}px;height:${BAR_H}px" onmouseenter="showTooltip(event,'${escAttr(r.model)}',${r.orig_idx})" onmouseleave="hideTooltip()" onclick="showDetailByIdx(${r.orig_idx})">${label}</div>`;
    }
  }
  const today=new Date();
  const ti=getMonthIndex(today);
  if(ti>=0){
    const tl=(ti+today.getDate()/30)*CELL_W;
    if(tl>=0&&tl<TOTAL_MONTHS*CELL_W) h+=`<div class="today-line" style="left:${tl}px"></div>`;
  }
  return h;
}

function renderGantt(){
  const groups=getFilteredGroups();
  const sorted=getSortedGroups(groups);
  const thead=document.getElementById('ganttThead');
  const tbody=document.getElementById('ganttTbody');

  let totalVisible=0;
  sorted.forEach(([,rows])=>totalVisible++);
  document.getElementById('visibleCount').textContent=totalVisible+' / '+stats.Model+' models';

  // Year spans
  const yearSpans={};
  MONTHS.forEach((m,i)=>{if(!yearSpans[m.y])yearSpans[m.y]={count:0};yearSpans[m.y].count++});

  let thH='<tr>';
  thH+='<th class="col-model">Model</th>';
  thH+='<th class="col-toggle"></th>';
  thH+='<th class="col-stage">Stage</th>';
  thH+='<th class="col-mkt">MKT Name</th>';
  thH+='<th class="col-mp">MP</th>';
  for(const[y,info]of Object.entries(yearSpans)){
    thH+=`<th colspan="${info.count}" style="text-align:center;padding:3px 2px;font-size:12px;font-weight:700;color:#bbb;background:#181b25">${y}</th>`;
  }
  thH+='</tr><tr>';
  thH+='<th class="col-model" style="visibility:hidden"></th>';
  thH+='<th class="col-toggle" style="visibility:hidden"></th>';
  thH+='<th class="col-stage" style="visibility:hidden"></th>';
  thH+='<th class="col-mkt" style="visibility:hidden"></th>';
  thH+='<th class="col-mp" style="visibility:hidden"></th>';
  for(const m of MONTHS) thH+=`<th class="gantt-cell-month" style="width:${CELL_W}px;min-width:${CELL_W}px">${m.m}</th>`;
  thH+='</tr>';
  thead.innerHTML=thH;

  let tbH='';
  for(const[model,rows]of sorted){
    const parent=rows[0];
    const hasChildren=rows.length>1;
    const isExpanded=expandedModels.has(model);

    // Parent row
    tbH+='<tr>';
    tbH+=`<td class="col-model">${model}</td>`;
    tbH+=`<td class="col-toggle" onclick="toggleExpand('${escAttr(model)}')">${hasChildren?(isExpanded?'−':'+'):''}</td>`;
    tbH+=`<td class="col-stage"><span class="badge badge-${parent.stage.toLowerCase()}">${parent.stage}</span></td>`;
    tbH+=`<td class="col-mkt" title="${escAttr(parent.mkt)}">${parent.mkt}</td>`;
    tbH+=`<td class="col-mp">${parent.dates.MP||'-'}</td>`;
    tbH+=`<td colspan="${TOTAL_MONTHS}" style="position:relative;padding:0;height:28px">${renderBarsHtml(parent)}</td>`;
    tbH+='</tr>';

    // Child rows
    if(hasChildren){
      for(let i=1;i<rows.length;i++){
        const r=rows[i];
        const show=isExpanded;
        tbH+=`<tr class="child-row${show?' open':''}">`;
        tbH+=`<td class="col-model" style="color:var(--text2);font-weight:400;padding-left:16px">${model}</td>`;
        tbH+=`<td class="col-toggle"></td>`;
        tbH+=`<td class="col-stage"><span class="badge badge-${r.stage.toLowerCase()}">${r.stage}</span></td>`;
        tbH+=`<td class="col-mkt" title="${escAttr(r.mkt)}">${r.mkt}</td>`;
        tbH+=`<td class="col-mp">${r.dates.MP||'-'}</td>`;
        tbH+=`<td colspan="${TOTAL_MONTHS}" style="position:relative;padding:0;height:28px">${renderBarsHtml(r)}</td>`;
        tbH+='</tr>';
      }
    }
  }
  tbody.innerHTML=tbH;
}

function showTooltip(e,model,idx){
  const r=DATA.records.find(x=>x.orig_idx===idx);
  if(!r)return;
  const tt=document.getElementById('tooltip');
  let h=`<div class="tt-model">${r.model}</div>`;
  h+=`<div class="tt-row"><span class="tt-label">Stage:</span><span class="tt-val">${r.stage}</span></div>`;
  h+=`<div class="tt-row"><span class="tt-label">NPM:</span><span class="tt-val">${r.npm||'-'}</span></div>`;
  for(const k of DATE_KEYS){
    if(r.dates[k]) h+=`<div class="tt-row"><span class="tt-label">${k}:</span><span class="tt-val">${r.dates[k]}</span></div>`;
  }
  tt.innerHTML=h;
  tt.style.display='block';
  tt.style.left=Math.min(e.clientX+10,window.innerWidth-300)+'px';
  tt.style.top=Math.min(e.clientY+10,window.innerHeight-200)+'px';
}
function hideTooltip(){document.getElementById('tooltip').style.display='none'}

function showDetailByIdx(idx){
  const r=DATA.records.find(x=>x.orig_idx===idx);
  if(!r)return;
  const overlay=document.getElementById('detailOverlay');
  const panel=document.getElementById('detailPanel');
  let h=`<span class="dp-close" onclick="closeDetail()">&times;</span>`;
  h+=`<h2>${r.model}</h2><div class="dp-mkt">${r.mkt}</div>`;
  h+=`<div class="dp-grid">`;
  h+=`<div class="dp-field"><div class="dp-field-label">Stage</div><div class="dp-field-value"><span class="badge badge-${r.stage.toLowerCase()}">${r.stage}</span></div></div>`;
  h+=`<div class="dp-field"><div class="dp-field-label">NPM</div><div class="dp-field-value">${r.npm||'-'}</div></div>`;
  h+=`<div class="dp-field"><div class="dp-field-label">CPU</div><div class="dp-field-value">${r.cpu||'-'}</div></div>`;
  h+=`<div class="dp-field"><div class="dp-field-label">GPU</div><div class="dp-field-value">${r.gpu||'-'}</div></div>`;
  for(const k of DATE_KEYS) h+=`<div class="dp-field"><div class="dp-field-label">${k}</div><div class="dp-field-value">${r.dates[k]||'-'}</div></div>`;
  h+='</div>';
  if(r.status)h+=`<div class="dp-section"><h3>Current Status</h3><div class="dp-text">${r.status}</div></div>`;
  if(r.highlight&&r.highlight!=='.')h+=`<div class="dp-section"><h3>Highlight</h3><div class="dp-text">${r.highlight}</div></div>`;
  panel.innerHTML=h;
  overlay.style.display='block';panel.style.display='block';
}
function closeDetail(){
  document.getElementById('detailOverlay').style.display='none';
  document.getElementById('detailPanel').style.display='none';
}
document.getElementById('detailOverlay').addEventListener('click',closeDetail);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});

renderStats();renderLegend();initFilters();renderGantt();
</script>
</body>
</html>
